name=TinyWG
version=0.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Portable WireGuard for Arduino: initiator and responder, several peers, as an lwIP interface or over any Arduino UDP.
paragraph=A WireGuard implementation that is not tied to one core. The protocol engine (Noise IKpsk2 handshake, sessions, timers, replay window, cryptokey routing) has no lwIP or Arduino dependency. TinyWG adds a wg0 lwIP network interface so existing clients, servers and MQTT brokers run through the tunnel (ESP32, CH32V with the Network library); TinyWGUdp runs over any Arduino UDP with raw IPv4 packets. Interoperates with the Linux kernel WireGuard. Crypto: Monocypher (X25519, ChaCha20-Poly1305) and BLAKE2s. BSD-3-Clause.
category=Communication
