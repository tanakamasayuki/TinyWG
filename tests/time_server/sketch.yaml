profiles:
  host:
    fqbn: lang-ship:host:host
    port: socket://localhost
    platforms:
      - platform: lang-ship:host (1.7.1)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../

  esp32:
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../

  esp32s3:
    fqbn: esp32:esp32:esp32s3
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../

  ch32v307:
    fqbn: ch32-riscv-ug:ch32rv:CH32V307:pnum=ANY
    platforms:
      - platform: ch32-riscv-ug:ch32rv (0.4.0)
        platform_index_url: https://ch32-riscv-ug.github.io/ArduinoCore-CH32RV/package_ch32-riscv-ug_index.json
    libraries:
      - dir: ../../

  picow:
    fqbn: rp2040:rp2040:rpipicow
    platforms:
      - platform: rp2040:rp2040 (6.3.1)
        platform_index_url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    libraries:
      - dir: ../../

default_profile: host
